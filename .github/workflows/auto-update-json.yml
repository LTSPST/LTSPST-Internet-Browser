name: Auto Update update.json

on:
  release:
    types: [published]

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Update update.json
        run: |
          # Получаем версию из тега релиза (например, v1.1.20)
          VERSION=${{ github.event.release.tag_name }}
          # Получаем ссылку на APK из релиза (если он там прикреплен)
          APK_URL=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest | jq -r '.assets[] | select(.name | endswith(".apk")) | .browser_download_url' | head -n 1)
          
          # Создаем или обновляем update.json
          echo "{
            \"version\": \"$VERSION\",
            \"download_url\": \"$APK_URL\",
            \"changelog\": \"Новое обновление: $VERSION\"
          }" > update.json

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "Auto-update update.json for ${{ github.event.release.tag_name }}" || echo "No changes to commit"
          git push

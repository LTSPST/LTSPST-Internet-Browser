<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LTSPST Browser — Приватный интернет-браузер</title>
  <meta name="description" content="Приватный интернет-браузер для использования без страха за слежку. Скачать APK для Android.">

  <style>
    :root {
      --bg: #050a14;
      --card: #0b1424;
      --border: rgba(80, 150, 255, 0.18);
      --text: #eef4ff;
      --muted: #9db4d6;
      --accent1: #2f7bff;
      --accent2: #46c2ff;
      --glow: rgba(47, 123, 255, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
    }

    /* ================= СЕТКА НА ФОНЕ ================= */
    .grid-bg {
      position: fixed; inset: 0; z-index: -2; pointer-events: none;
      background-image:
        linear-gradient(rgba(47, 123, 255, 0.10) 1px, transparent 1px),
        linear-gradient(90deg, rgba(47, 123, 255, 0.10) 1px, transparent 1px);
      background-size: 48px 48px;
      animation: gridShift 12s ease-in-out infinite alternate;
      mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 30%, #000 20%, transparent 75%);
    }
    @keyframes gridShift {
      0%   { filter: hue-rotate(0deg) brightness(1); }
      50%  { filter: hue-rotate(20deg) brightness(1.2); }
      100% { filter: hue-rotate(-15deg) brightness(0.9); }
    }

    /* ================= СНЕГ ================= */
    .snow { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
    .snowflake {
      position: absolute; top: -10px; color: #cfe4ff; opacity: 0.85;
      animation-name: fall, drift;
      animation-timing-function: linear, ease-in-out;
      animation-iteration-count: infinite, infinite;
      animation-direction: normal, alternate;
      text-shadow: 0 0 6px rgba(120, 180, 255, 0.9);
    }
    @keyframes fall { from { transform: translateY(-10px); } to { transform: translateY(105vh); } }
    @keyframes drift { from { margin-left: -30px; } to { margin-left: 30px; } }

    /* ================= HEADER ================= */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(5, 10, 20, 0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px;
    }
    .header-logo {
      display: flex; align-items: center; gap: 12px;
      text-decoration: none; color: var(--text);
      font-weight: 900; font-size: 1.2rem; letter-spacing: 0.5px;
    }
    .header-logo img {
      width: 36px; height: 36px; border-radius: 8px; object-fit: cover;
      box-shadow: 0 4px 14px var(--glow);
    }

    /* ================= ГИРЛЯНДА ================= */
    .garland {
      display: flex; justify-content: center; gap: 10px;
      padding: 10px 16px 14px; overflow: hidden;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(47, 123, 255, 0.06), transparent);
    }
    .bulb {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent2);
      box-shadow: 0 0 10px 3px rgba(70, 194, 255, 0.75);
      animation: blink 1.6s infinite ease-in-out;
      flex-shrink: 0;
    }
    .bulb:nth-child(2n) { background: #7fb4ff; box-shadow: 0 0 10px 3px rgba(127, 180, 255, 0.7); animation-delay: 0.2s; }
    .bulb:nth-child(3n) { background: #46c2ff; animation-delay: 0.4s; }
    .bulb:nth-child(4n) { background: #b7d6ff; box-shadow: 0 0 10px 3px rgba(183, 214, 255, 0.7); animation-delay: 0.6s; }
    .bulb:nth-child(5n) { animation-delay: 0.8s; }
    .bulb:nth-child(7n) { animation-delay: 1s; }
    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.35; transform: scale(0.82); }
    }

    /* ================= КОНТЕНТ ================= */
    .container { max-width: 760px; width: 100%; margin: 0 auto; padding: 40px 18px; flex: 1; text-align: center; }

    .page-title {
      font-size: 2.5rem; font-weight: 900; letter-spacing: 0.5px; margin-bottom: 12px;
      background: linear-gradient(90deg, var(--accent2), var(--accent1));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .page-subtitle { color: var(--muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto 30px; }

    /* КНОПКА СКАЧАТЬ */
    .download-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 16px 40px; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: #fff; font-weight: 800; font-size: 1.1rem; text-decoration: none;
      box-shadow: 0 10px 30px rgba(47, 123, 255, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-bottom: 40px;
    }
    .download-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(47, 123, 255, 0.5); }
    .download-btn svg { width: 24px; height: 24px; fill: currentColor; }

    /* ================= СКРИНЫ ================= */
    .screens-grid {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 40px;
      flex-wrap: nowrap; /* Строго в одну строку */
    }
    .screen-item {
      flex: 1; /* Растягиваются равномерно */
      max-width: 180px; /* Ограничение размера, чтобы не были гигантскими */
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #070f1c;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: transform 0.25s, border-color 0.25s;
    }
    .screen-item:hover {
      transform: translateY(-5px);
      border-color: var(--accent1);
    }
    .screen-item img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 9 / 19.5;
      object-fit: cover;
      background: #070f1c;
    }

    /* На мобилках чуть уменьшим отступы, но оставим в строку */
    @media (max-width: 600px) {
      .screens-grid { gap: 8px; }
      .screen-item { border-radius: 10px; }
    }

    /* ================= ВЕРСИЯ / CHANGELOG ================= */
    .version-box {
      background: linear-gradient(145deg, #0b1424, #070f1c);
      border: 1px solid var(--border); border-radius: 18px;
      padding: 24px; margin-bottom: 40px; text-align: left;
    }
    .version-head { 
      display: flex; align-items: center; justify-content: space-between; 
      flex-wrap: wrap; gap: 8px; margin-bottom: 12px; 
      border-bottom: 1px solid var(--border); padding-bottom: 12px; 
    }
    .version-num { font-weight: 800; font-size: 1.15rem; color: var(--accent2); }
    .changelog { color: var(--muted); font-size: 0.95rem; white-space: pre-line; line-height: 1.6; }

    /* ================= ПЛАТФОРМА ================= */
    .platform-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px; margin-bottom: 40px;
    }
    .platform-item {
      background: linear-gradient(145deg, #0b1424, #070f1c);
      border: 1px solid var(--border); border-radius: 14px;
      padding: 16px 18px; text-align: center;
    }
    .platform-item .icon { font-size: 1.5rem; margin-bottom: 6px; }
    .platform-item .label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .platform-item .value { font-weight: 800; font-size: 1rem; color: var(--text); }

    /* ================= ПЛАВАЮЩАЯ КНОПКА ================= */
    .floating-download {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(120px);
      z-index: 200; display: flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 28px; border-radius: 50px;
      background: linear-gradient(135deg, var(--accent1), var(--accent2));
      color: #fff; font-weight: 800; font-size: 1rem; text-decoration: none;
      box-shadow: 0 10px 30px rgba(47, 123, 255, 0.5);
      opacity: 0; pointer-events: none;
      transition: transform 0.35s ease, opacity 0.35s ease;
      white-space: nowrap;
    }
    .floating-download.visible { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: auto; }
    .floating-download svg { width: 20px; height: 20px; fill: currentColor; }

    footer { text-align: center; padding: 24px 18px; border-top: 1px solid var(--border); color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="grid-bg" aria-hidden="true"></div>
  <div class="snow" id="snow" aria-hidden="true"></div>

  <header class="header">
    <a href="/" class="header-logo">
      <img src="logo.png" alt="Логотип LTSPST" onerror="this.style.display='none';">
      LTSPST Browser
    </a>
  </header>

  <!-- ГИРЛЯНДА -->
  <div class="garland" aria-hidden="true">
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
    <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
  </div>

  <div class="container">
    
    <!-- 1. ЗАГОЛОВОК -->
    <h1 class="page-title">Internet Browser</h1>
    
    <!-- 2. ОПИСАНИЕ -->
    <p class="page-subtitle">Приватный интернет-браузер для использования без страха за слежку</p>

    <!-- 3. КНОПКА СКАЧАТЬ -->
    <a href="#" id="mainDownloadBtn" class="download-btn" target="_blank">
      <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
      Скачать APK
    </a>

    <!-- 4. СКРИНЫ -->
    <div class="screens-grid">
      <div class="screen-item"><img src="screen1.png" alt="Скриншот 1" loading="lazy"></div>
      <div class="screen-item"><img src="screen2.png" alt="Скриншот 2" loading="lazy"></div>
      <div class="screen-item"><img src="screen3.png" alt="Скриншот 3" loading="lazy"></div>
    </div>

    <!-- 5. ПОСЛЕДНИЕ ИЗМЕНЕНИЯ (ИЗ UPDATE.JSON) -->
    <div class="version-box">
      <div class="version-head">
        <span class="version-num">Версия: <span id="browserVersion">Загрузка...</span></span>
      </div>
      <div class="changelog" id="changelogText">Получение списка изменений...</div>
    </div>

    <!-- 6. ИНФОРМАЦИЯ О ПЛАТФОРМЕ -->
    <div class="platform-grid">
      <div class="platform-item">
        <div class="icon">🤖</div>
        <div class="label">Android</div>
        <div class="value">8.0 – 16</div>
      </div>
      <div class="platform-item">
        <div class="icon">⚙️</div>
        <div class="label">Архитектура</div>
        <div class="value">32 и 64 бит</div>
      </div>
      <div class="platform-item">
        <div class="icon">🦊</div>
        <div class="label">Движок</div>
        <div class="value">GeckoView</div>
      </div>
    </div>

  </div>

  <!-- 7. ФУТЕР -->
  <footer>
    @2026 | Проект LTSPST | Официальный сайт
  </footer>

  <!-- ПЛАВАЮЩАЯ КНОПКА -->
  <a href="#" id="floatDownloadBtn" class="floating-download" target="_blank">
    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
    Скачать APK
  </a>

  <script>
    // ===== ГЕНЕРАЦИЯ СНЕГА =====
    (function createSnow() {
      const snowContainer = document.getElementById('snow');
      const flakeCount = 50;
      for (let i = 0; i < flakeCount; i++) {
        const flake = document.createElement('span');
        flake.className = 'snowflake';
        flake.textContent = Math.random() > 0.5 ? '❄' : '•';
        const size = Math.random() * 10 + 6;
        const left = Math.random() * 100;
        const fallDuration = Math.random() * 8 + 6;
        const driftDuration = Math.random() * 3 + 2;
        const delay = Math.random() * -20;

        flake.style.left = left + 'vw';
        flake.style.fontSize = size + 'px';
        flake.style.opacity = (Math.random() * 0.5 + 0.4).toFixed(2);
        flake.style.animationDuration = fallDuration + 's, ' + driftDuration + 's';
        flake.style.animationDelay = delay + 's, ' + delay + 's';
        snowContainer.appendChild(flake);
      }
    })();

    // ===== ЗАГРУЗКА UPDATE.JSON =====
    async function loadUpdateInfo() {
      const versionEl = document.getElementById('browserVersion');
      const changelogEl = document.getElementById('changelogText');
      const mainBtn = document.getElementById('mainDownloadBtn');
      const floatBtn = document.getElementById('floatDownloadBtn');

      try {
        const response = await fetch('update.json');
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();

        versionEl.textContent = data.latest_version || 'Неизвестно';
        changelogEl.textContent = data.changelog || 'Список изменений пуст.';

        if (data.apk_url) {
          mainBtn.href = data.apk_url;
          floatBtn.href = data.apk_url;
        }
      } catch (error) {
        console.error('Ошибка загрузки update.json:', error);
        versionEl.textContent = 'Ошибка загрузки';
        changelogEl.textContent = 'Не удалось получить данные об обновлении. Попробуйте позже.';
        mainBtn.href = 'https://github.com/LTSPST/LTSPST-Internet-Browser/releases/latest';
        floatBtn.href = 'https://github.com/LTSPST/LTSPST-Internet-Browser/releases/latest';
      }
    }
    loadUpdateInfo();

    // ===== ПЛАВАЮЩАЯ КНОПКА ПРИ СКРОЛЛЕ =====
    const mainBtn = document.getElementById('mainDownloadBtn');
    const floatBtn = document.getElementById('floatDownloadBtn');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) {
          floatBtn.classList.add('visible');
        } else {
          floatBtn.classList.remove('visible');
        }
      });
    }, { threshold: 0 });

    observer.observe(mainBtn);
  </script>
</body>
</html>
